name: Performance

# A pull request may not make the player ask the canvas for more work, or make the download heavier: its build is benchmarked
# against the base branch's, in turns on the same runner (see scripts/bench.mjs). What fails the job is exact — the operations
# each surface draws over a fixed song at a frozen frame clock, and the gzipped bytes — and any rise at all fails it. Frame
# time is in the table but fails nothing: a shared runner's noise is wider than any gate worth setting on it. A regression
# taken on purpose passes with the perf-ok label.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: No more drawing, no bigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare with ${{ github.base_ref }}
        env:
          PERF_OK: ${{ contains(github.event.pull_request.labels.*.name, 'perf-ok') }}
        run: |
          if [ -f base/package.json ] && node scripts/build.mjs base; then
            node scripts/bench.mjs base/dist dist
          else
            echo "::notice::The base branch has no build to compare with yet"
            node scripts/bench.mjs dist
          fi
