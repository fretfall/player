<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretfall</title>
<link id="fonts" rel="stylesheet" href="">
<style>
  :root { --bg: #0e1014; --ink: #0e1014; --text: #e8eaef; --muted: #7b8190; --accent: #c8f04a; --chip: #171a20; --chip-border: #2a2f38; --done: #e8eaef; --todo: #23272f; --ui: system-ui, sans-serif; --num: system-ui, sans-serif; --lyric: system-ui, sans-serif; --lyric-style: normal; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 var(--ui); accent-color: var(--accent); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; }
  .bar { position: fixed; left: 32px; right: 32px; top: 18px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .group { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .wordmark { font: 700 15px var(--num); letter-spacing: .22em; }
  .song { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .song b { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 26vw; }
  .song span { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16vw; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--chip); border: 1px solid var(--chip-border); overflow-x: auto; }
  .seg button { border: 0; background: none; cursor: pointer; padding: 5px 12px; border-radius: 6px; font: 500 13px var(--ui); color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); font-weight: 600; }
  .icon { flex: none; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 8px; background: var(--chip); border: 1px solid var(--chip-border); color: var(--text); }
  .icon[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .speed { height: 36px; display: flex; align-items: center; padding: 0 2px; border-radius: 8px; background: var(--chip); border: 1px solid var(--chip-border); color: var(--muted); }
  .speed button { cursor: pointer; width: 28px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: inherit; }
  .speed output { min-width: 46px; text-align: center; font: 600 14px var(--num); color: var(--text); }
  .time { margin-right: 6px; font: 14px var(--num); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .divider { width: 1px; height: 24px; margin: 0 4px; background: var(--chip-border); }
  #phrases { position: fixed; left: 32px; right: 32px; top: 74px; height: 54px; display: flex; align-items: flex-end; gap: 3px; }
  #phrases div { flex-basis: 0; min-width: 2px; border-radius: 2px; background: var(--todo); cursor: pointer; }
  #phrases div.done { background: var(--done); }
  #phrases div.loop { box-shadow: 0 -3px 0 var(--accent); }
  #progress { position: fixed; left: 32px; right: 32px; top: 134px; height: 2px; background: var(--todo); }
  #progress div { width: 0; height: 2px; background: var(--accent); }
  #lyrics { position: fixed; left: 40px; top: 164px; max-width: min(520px, 42vw); display: flex; flex-direction: column; gap: 8px; pointer-events: none; font-family: var(--lyric); font-style: var(--lyric-style); }
  #section { min-height: 16px; font: 600 12px var(--num); letter-spacing: .18em; color: var(--accent); }
  #line { min-height: 37px; font-size: 32px; line-height: 1.15; color: var(--muted); }
  #line .sung { color: var(--text); }
  #next { min-height: 28px; font-size: 24px; line-height: 1.15; color: var(--muted); opacity: .6; }
  #score { position: fixed; right: 40px; top: 164px; text-align: right; }
  #score b { display: block; font: 600 40px/1 var(--num); }
  #score span { font-size: 13px; color: var(--muted); }
  #status { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: min(560px, 90vw); padding: 10px 16px; border-radius: 10px; background: var(--chip); border: 1px solid var(--chip-border); backdrop-filter: blur(10px); text-align: center; }
  #settings { position: fixed; right: 32px; top: 66px; z-index: 2; width: 320px; display: grid; gap: 14px; padding: 16px; border-radius: 12px; background: var(--ink); border: 1px solid var(--chip-border); box-shadow: 0 20px 50px rgba(0, 0, 0, .5); }
  .field { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .field .seg { overflow: visible; }
  .field .seg button { flex: 1; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  #drop { position: fixed; inset: 12px; z-index: 3; display: grid; place-items: center; border: 2px dashed var(--accent); border-radius: 16px; background: rgba(0, 0, 0, .45); font: 600 20px var(--num); }
  #tab { position: fixed; left: -10000px; top: 0; width: 1000px; }
</style>
</head>
<body>
<canvas id="highway"></canvas>
<header class="bar">
  <div class="group" style="gap: 20px">
    <div class="wordmark">FRETFALL</div>
    <div class="song"><b id="title">Loading…</b><span id="artist"></span></div>
    <div class="seg" id="arrangements" role="group" aria-label="Arrangement"></div>
  </div>
  <div class="group">
    <span class="time" id="time">0:00 / 0:00</span>
    <div class="speed">
      <button id="slower" aria-label="Slower"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 10h10"/></svg></button>
      <output id="speed" aria-label="Speed">100%</output>
      <button id="faster" aria-label="Faster"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 5v10M5 10h10"/></svg></button>
    </div>
    <button class="icon" id="loop" aria-pressed="false" title="Loop this phrase (L). Shift-click the phrase bar to extend."><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3.5l2.5 2.5-2.5 2.5"/><path d="M4 10V9a3 3 0 0 1 3-3h9"/><path d="M6.5 16.5L4 14l2.5-2.5"/><path d="M16 10v1a3 3 0 0 1-3 3H4"/></svg></button>
    <button class="icon" id="listen" aria-pressed="false" title="Listen to your guitar and score hits (use headphones)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg></button>
    <button class="icon" id="play" title="Play / pause (Space)"></button>
    <div class="divider"></div>
    <button class="icon" id="open" title="Open a .pak or Guitar Pro file (or drop it anywhere)"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5V15a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 17 15V8.5A1.5 1.5 0 0 0 15.5 7H10L8.5 5H4.5A1.5 1.5 0 0 0 3 6.5z"/></svg></button>
    <button class="icon" id="settingsButton" aria-expanded="false" aria-controls="settings" title="Settings"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 6h8M15.5 6h1M3.5 14h2M9.5 14h7"/><circle cx="13.5" cy="6" r="2"/><circle cx="7.5" cy="14" r="2"/></svg></button>
  </div>
</header>
<div id="phrases"></div>
<div id="progress"><div></div></div>
<div id="lyrics"><div id="section"></div><div id="line"></div><div id="next"></div></div>
<div id="score" hidden><b id="accuracy">–</b><span id="heard">accuracy</span></div>
<div id="settings" hidden>
  <div class="field">Look<div class="seg" data-setting="look"></div></div>
  <div class="field">Colours<div class="seg" data-setting="colors"></div></div>
  <div class="field">Fonts<div class="seg" data-setting="fonts"></div></div>
  <label class="field" title="Raise it if notes reach the strings before you hear them">Audio delay <output id="offsetOut"></output><input id="offset" type="range" min="-300" max="300" step="10"></label>
  <label class="check"><input id="mute" type="checkbox"> Mute my part (Guitar Pro files)</label>
</div>
<div id="status" role="status" hidden></div>
<div id="drop" hidden>Drop a .pak or Guitar Pro file</div>
<input type="file" id="file" hidden accept=".pak,.gp,.gp3,.gp4,.gp5,.gpx,.musicxml,.mxl,.xml">
<div id="tab"></div>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<script type="module">
import { tempoMap, tickToMs, msToTick, detectPitch, noteName } from './music.js';
import { loadSong } from './the reference game.js';
import { LOOKS, COLORS, FONTS, DEFAULT_STYLE, theme as makeTheme } from './themes.js';
import { drawHighway } from './highway.js';

const $ = (id) => document.getElementById(id);
const CDN = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
const WW2OGG = 'https://cdn.jsdelivr.net/npm/ww2ogg-ts@0.2.0/+esm';
const OPEN_STRINGS = { 4: [28, 33, 38, 43], 5: [23, 28, 33, 38, 43], 6: [40, 45, 50, 55, 59, 64], 7: [35, 40, 45, 50, 55, 59, 64] };
const PLAY = '<svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M6.5 4.2v11.6L16 10z"/></svg>';
const PAUSE = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7.5 4.5v11M12.5 4.5v11"/></svg>';
const clock = (s) => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s) % 60)).padStart(2, '0')}`;
const paint = () => new Promise((r) => { requestAnimationFrame(() => setTimeout(r)); setTimeout(r, 100); }); // background tabs get no frames

// Original practice riff so there's something to play before you open a file.
const DEMO = `
\\title "Fretfall Demo"
\\subtitle "Original practice riff"
\\tempo 100
.
\\track "Guitar"
\\staff {tabs}
\\instrument distortionguitar
\\ro :8 (0.6 2.5) (0.6 2.5) (0.6 2.5) (0.6 2.5) (3.6 5.5) (3.6 5.5) (5.6 7.5) (5.6 7.5) |
\\rc 2 (7.6 9.5) (7.6 9.5) (5.5 7.4) (5.5 7.4) (3.6 5.5) (3.6 5.5) (5.6 7.5) r |
:16 12.1 15.1 12.2 15.2 12.3 14.3 12.4 14.4 :8 14.3 12.3 14.4 12.4 |
:4 14.5 :8 12.5 14.5 :2 12.6 |
\\track "Bass"
\\staff {tabs}
\\tuning (G2 D2 A1 E1)
\\instrument electricbassfinger
\\ro :8 0.4 0.4 0.4 0.4 3.4 3.4 5.4 5.4 |
\\rc 2 7.4 7.4 5.3 5.3 3.4 3.4 5.4 r |
:4 0.4 0.4 3.4 5.4 |
:2 0.4 0.4 |
`;

// --- Settings: look, colours and fonts mix freely; everything is remembered per browser
const settings = { ...DEFAULT_STYLE, offset: 0, mute: false };
try { Object.assign(settings, JSON.parse(localStorage.getItem('fretfall') ?? '{}')); } catch {}
for (const [key, options] of [['look', LOOKS], ['colors', COLORS], ['fonts', FONTS]]) if (!options[settings[key]]) settings[key] = DEFAULT_STYLE[key];
const save = () => { try { localStorage.setItem('fretfall', JSON.stringify(settings)); } catch {} };
let theme;

function applyTheme() {
  theme = makeTheme(settings);
  $('fonts').href = theme.href;
  const vars = { bg: theme.bg, ink: theme.ink, text: theme.text, muted: theme.muted, accent: theme.accent, chip: theme.chip, 'chip-border': theme.chipBorder, done: theme.phraseDone, todo: theme.phraseTodo, ui: theme.ui, num: theme.num, lyric: theme.lyric, 'lyric-style': theme.lyricStyle };
  for (const [k, v] of Object.entries(vars)) document.documentElement.style.setProperty(`--${k}`, v);
  for (const seg of document.querySelectorAll('[data-setting]')) for (const b of seg.children) b.setAttribute('aria-pressed', String(b.value === settings[seg.dataset.setting]));
}
for (const seg of document.querySelectorAll('[data-setting]')) {
  const options = { look: LOOKS, colors: COLORS, fonts: FONTS }[seg.dataset.setting];
  for (const [value, { label }] of Object.entries(options)) {
    const b = Object.assign(document.createElement('button'), { value, textContent: label });
    b.onclick = () => { settings[seg.dataset.setting] = value; save(); applyTheme(); };
    seg.append(b);
  }
}
$('offset').value = settings.offset;
$('offsetOut').value = `${settings.offset} ms`;
$('offset').oninput = (e) => { settings.offset = +e.target.value; $('offsetOut').value = `${settings.offset} ms`; save(); };
$('mute').checked = settings.mute;
$('mute').onchange = (e) => { settings.mute = e.target.checked; save(); if (arr?.track) api.changeTrackMute([arr.track], settings.mute); };
const toggleSettings = (open = $('settings').hidden) => { $('settings').hidden = !open; $('settingsButton').setAttribute('aria-expanded', String(open)); };
$('settingsButton').onclick = () => toggleSettings();
addEventListener('pointerdown', (e) => { if (!$('settings').hidden && !e.target.closest('#settings, #settingsButton')) toggleSettings(false); });
applyTheme();

let statusTimer;
function status(text, sticky = false) {
  clearTimeout(statusTimer);
  $('status').textContent = text ?? '';
  $('status').hidden = !text;
  if (text && !sticky) statusTimer = setTimeout(() => ($('status').hidden = true), 5000);
}

// --- Players: a packed song plays its real audio, Guitar Pro files play through alphaTab's synth
let song = null, arr = null, player = null, speed = 1, loop = null;

function audioPlayer(ogg) {
  const el = new Audio(URL.createObjectURL(new Blob([ogg], { type: 'audio/ogg' })));
  el.preservesPitch = true;
  el.onplay = el.onpause = updatePlayButton;
  return {
    get time() { return el.currentTime; },
    get playing() { return !el.paused; },
    play: () => el.play(),
    pause: () => el.pause(),
    seek: (t) => { el.currentTime = Math.max(0, t); },
    setSpeed: (v) => { el.playbackRate = v; },
    stop: () => { el.pause(); URL.revokeObjectURL(el.src); },
  };
}

const api = new alphaTab.AlphaTabApi($('tab'), {
  core: { fontDirectory: CDN + 'font/' },
  display: { staveProfile: 'Tab' },
  player: { playerMode: 'EnabledSynthesizer', soundFont: CDN + 'soundfont/sonivox.sf2', enableCursor: false, enableUserInteraction: false },
});
const synth = { tick: 0, at: 0, playing: false, tempo: [] };
api.playerPositionChanged.on((e) => { synth.tick = e.currentTick; synth.at = performance.now(); });
api.playerStateChanged.on((e) => { synth.playing = e.state === alphaTab.synth.PlayerState.Playing; synth.at = performance.now(); updatePlayButton(); });
api.soundFontLoad.on((e) => status(`Loading instrument sounds ${Math.round((e.loaded / e.total) * 100)}%`, true));
api.playerReady.on(() => status(null));
api.error.on((e) => status(`Could not read that file: ${e.message}`));

const synthPlayer = {
  // position events arrive every few ms; extrapolate between them, never far past the last one
  get time() { return synth.tempo.length ? (tickToMs(synth.tempo, synth.tick) + (synth.playing ? Math.min(performance.now() - synth.at, 100) * api.playbackSpeed : 0)) / 1000 : 0; },
  get playing() { return synth.playing; },
  play: () => api.play(),
  pause: () => api.pause(),
  seek: (t) => { synth.tick = msToTick(synth.tempo, Math.max(0, t) * 1000); synth.at = performance.now(); api.tickPosition = synth.tick; },
  setSpeed: (v) => { api.playbackSpeed = v; },
  stop: () => api.stop(),
};

function usePlayer(next) {
  if (player && player !== next) player.stop();
  player = next;
  player.setSpeed(speed);
  updatePlayButton();
}
function updatePlayButton() { $('play').innerHTML = player?.playing ? PAUSE : PLAY; }

// alphaTab score → the same model the reference game.js produces (seconds, string 0 = lowest)
let builtCache = null;
function songFromScore(score, cache) {
  const tempo = tempoMap(cache.masterBars.flatMap((mb) => mb.tempoChanges), score.tempo);
  const sec = (tick) => tickToMs(tempo, tick) / 1000;
  const arrangements = score.tracks.filter((tr) => tr.staves[0].isStringed && !tr.staves[0].isPercussion).map((track) => {
    const staff = track.staves[0], notes = [], chords = [], anchors = [], phrases = [], beats = [], sections = [], lastOnString = {};
    let anchor = { fret: 1, width: 4 };
    for (const mb of cache.masterBars) {
      const master = mb.masterBar, start = sec(mb.start), end = sec(mb.end), perBeat = (mb.end - mb.start) / master.timeSignatureNumerator;
      for (let i = 0; i < master.timeSignatureNumerator; i++) beats.push({ time: sec(mb.start + i * perBeat), measure: i ? -1 : master.index });
      if (master.section) sections.push({ time: start, name: master.section.text });
      const inBar = [];
      for (const voice of staff.bars[master.index].voices) for (const beat of voice.beats) {
        const t0 = sec(mb.start + beat.playbackStart), t1 = sec(mb.start + beat.playbackStart + beat.playbackDuration);
        const chord = beat.notes.length > 1 ? chords.push({ time: t0, name: beat.chord?.name ?? '', notes: [], highDensity: false, palmMute: false }) - 1 : null;
        for (const nt of beat.notes) {
          const tied = nt.isTieDestination && lastOnString[nt.string];
          if (tied) { tied.sustain = t1 - tied.time; continue; }
          const origin = nt.hammerPullOrigin;
          const note = {
            time: t0, sustain: t1 - t0 >= 0.4 ? t1 - t0 : 0, string: nt.string - 1, fret: nt.fret, chord, midi: nt.realValue,
            hammerOn: !!origin && nt.fret > origin.fret, pullOff: !!origin && nt.fret < origin.fret,
            slideTo: nt.slideTarget ? nt.slideTarget.fret : null, slideUnpitchTo: null,
            bend: nt.hasBend ? (nt.maxBendPoint?.value ?? 0) / 4 : 0, harmonic: nt.isHarmonic, palmMute: nt.isPalmMute, mute: nt.isDead, tap: beat.tap,
          };
          notes.push((lastOnString[nt.string] = note));
          inBar.push(note);
        }
      }
      const frets = inBar.map((x) => x.fret).filter((f) => f > 0);
      if (frets.length) anchor = { fret: Math.min(...frets), width: Math.max(4, Math.max(...frets) - Math.min(...frets) + 1) };
      anchors.push({ time: start, endTime: end, ...anchor });
      phrases.push({ time: start, endTime: end, name: '', maxDifficulty: inBar.length });
    }
    notes.sort((a, b) => a.time - b.time || a.string - b.string);
    notes.forEach((x, i) => x.chord !== null && chords[x.chord].notes.push(i));
    return { name: track.name || 'Track', strings: staff.tuning.length, tuning: [], notes, chords, anchors, phrases, sections, beats, track };
  });
  return { title: score.title, artist: score.artist, length: sec(cache.masterBars.at(-1)?.end ?? 0), arrangements, lyrics: [], tempo };
}

// Chart lyrics: "-" joins a syllable to the next, "+" ends a line. Many charts skip the "+",
// so pauses and line length break lines too.
function lyricLines(lyrics) {
  const lines = [];
  let words = [];
  for (const { time, length, text } of lyrics) {
    if (words.length && time - words.at(-1).end > 2) { lines.push(words); words = []; }
    const raw = text.replace(/\+$/, ''), joined = raw.endsWith('-');
    words.push({ time, end: time + length, text: joined ? raw.slice(0, -1) : `${raw} ` });
    const long = !joined && words.reduce((sum, w) => sum + w.text.length, 0) > 34;
    if (text.endsWith('+') || long) { lines.push(words); words = []; }
  }
  if (words.length) lines.push(words);
  return lines.map((w) => ({ time: w[0].time, end: w.at(-1).end, syllables: w }));
}

function setSong(next) {
  song = { ...next, lines: lyricLines(next.lyrics) };
  loop = null;
  $('title').textContent = song.title || 'Untitled';
  $('artist').textContent = song.artist || '';
  document.title = `${song.title || 'Untitled'} – Fretfall`;
  $('arrangements').replaceChildren(...song.arrangements.map((a, i) => {
    const b = Object.assign(document.createElement('button'), { textContent: a.name });
    b.onclick = () => selectArrangement(i);
    return b;
  }));
  if (song.arrangements.length) selectArrangement(0);
  else { arr = null; status('No guitar or bass parts in this file'); }
}

let bars = [], ui = {};
function selectArrangement(i) {
  if (arr?.track) api.changeTrackMute([arr.track], false);
  arr = song.arrangements[i];
  if (arr.track) api.changeTrackMute([arr.track], settings.mute);
  for (const n of arr.notes) n.hit = n.missed = false;
  [...$('arrangements').children].forEach((b, j) => b.setAttribute('aria-pressed', String(i === j)));

  const total = {}, seen = {};
  const names = arr.sections.map((s) => s.name.replace(/[_-]+/g, ' ').toUpperCase());
  names.forEach((nm) => (total[nm] = (total[nm] ?? 0) + 1));
  arr.sectionLabels = names.map((nm) => (total[nm] > 1 ? `${nm} ${(seen[nm] = (seen[nm] ?? 0) + 1)}` : nm));

  const hardest = Math.max(1, ...arr.phrases.map((p) => p.maxDifficulty));
  bars = arr.phrases.map((p) => {
    const b = document.createElement('div');
    b.style.flexGrow = Math.max(0.01, p.endTime - p.time);
    b.style.height = `${Math.max(8, (p.maxDifficulty / hardest) * 100)}%`;
    b.onclick = (e) => {
      if (loop) loop = e.shiftKey ? { start: Math.min(loop.start, p.time), end: Math.max(loop.end, p.endTime) } : { start: p.time, end: p.endTime };
      player?.seek(p.time);
      markLoop();
    };
    return b;
  });
  $('phrases').replaceChildren(...bars);
  ui = {};
}

function markLoop() {
  bars.forEach((b, j) => b.classList.toggle('loop', !!loop && arr.phrases[j].time >= loop.start && arr.phrases[j].endTime <= loop.end));
  $('loop').setAttribute('aria-pressed', String(!!loop));
}

// --- Opening files
async function openFile(file) {
  const bytes = await file.arrayBuffer();
  if (!/\.pak$/i.test(file.name)) {
    usePlayer(synthPlayer);
    builtCache = api.tickCache; // rebuild once alphaTab has the new score
    return api.load(new Uint8Array(bytes));
  }
  status('Opening song… converting the audio takes a few seconds', true);
  await paint();
  try {
    const ww = await import(WW2OGG);
    const next = await loadSong(bytes, { wemToOgg: (wem) => ww.convertWwiseRiffToOgg(wem, { codebooks: ww.getPackedCodebooks('aoTuV_603') }).ogg });
    if (!next.audio) throw new Error('no audio in this file');
    for (const a of next.arrangements) for (const n of a.notes) n.midi = (OPEN_STRINGS[a.strings]?.[n.string] ?? 40) + (a.tuning[n.string] ?? 0) + n.fret;
    usePlayer(audioPlayer(next.audio));
    setSong(next);
    status(null);
  } catch (e) {
    status(`Could not open ${file.name}: ${e.message}`);
  }
}
$('open').onclick = () => $('file').click();
$('file').onchange = (e) => { if (e.target.files[0]) openFile(e.target.files[0]); e.target.value = ''; };
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (e.dataTransfer.files[0]) openFile(e.dataTransfer.files[0]); });

// --- Transport
const togglePlay = () => { if (player) player.playing ? player.pause() : Promise.resolve(player.play()).catch((e) => status(e.message)); };
function setSpeed(v) {
  speed = Math.min(1.5, Math.max(0.25, Math.round(v * 20) / 20));
  player?.setSpeed(speed);
  $('speed').value = `${Math.round(speed * 100)}%`;
}
function toggleLoop() {
  const p = arr?.phrases.findLast((x) => x.time <= songTime());
  loop = loop || !p ? null : { start: p.time, end: p.endTime };
  markLoop();
}
$('play').onclick = togglePlay;
$('slower').onclick = () => setSpeed(speed - 0.1);
$('faster').onclick = () => setSpeed(speed + 0.1);
$('loop').onclick = toggleLoop;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') toggleSettings(false);
  const action = { ' ': togglePlay, l: toggleLoop, ArrowLeft: () => player?.seek(songTime() - 5), ArrowRight: () => player?.seek(songTime() + 5) }[e.key];
  if (!action) return;
  e.preventDefault();
  action();
});

// --- Listening: pitch from mic/interface, scored against the notes at the strike line
let mic = null, heard = null, lastTime = 0;
$('listen').onclick = async () => {
  if (mic) {
    mic.stream.getTracks().forEach((tr) => tr.stop());
    mic.ctx.close();
    mic = heard = null;
  } else {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      const ctx = new AudioContext(), analyser = ctx.createAnalyser();
      analyser.fftSize = 4096;
      ctx.createMediaStreamSource(stream).connect(analyser);
      mic = { stream, ctx, analyser, buf: new Float32Array(analyser.fftSize) };
    } catch (e) {
      status(`No microphone: ${e.message}`);
    }
  }
  $('listen').setAttribute('aria-pressed', String(!!mic));
  $('score').hidden = !mic;
};

function score(t) {
  if (!arr) return;
  if (t < lastTime - 0.25) for (const n of arr.notes) if (n.time + n.sustain > t) n.hit = n.missed = false; // rewound or looped: fresh attempt
  lastTime = t;
  if (!mic || !player?.playing) return;
  mic.analyser.getFloatTimeDomainData(mic.buf);
  const pitch = detectPitch(mic.buf, mic.ctx.sampleRate);
  heard = pitch === null ? null : Math.round(pitch);
  for (const n of arr.notes) {
    if (n.time > t + 0.12) break;
    if (n.hit || n.missed || n.mute) continue;
    const deadline = n.time + Math.max(n.sustain, 0.25);
    if (t > deadline) n.missed = t - deadline < 0.5; // only notes that just went by, not the whole past
    else if (heard !== null && t >= n.time - 0.12 && (heard - n.midi) % 12 === 0) // octave errors forgiven
      (n.chord === null ? [n] : arr.chords[n.chord].notes.map((j) => arr.notes[j])).forEach((m) => (m.hit = true));
  }
}

// --- Frame loop
const canvas = $('highway'), cam = { fret: 1, width: 4, at: 0 };
const songTime = () => (player ? player.time - settings.offset / 1000 : 0);

function fillLine(el, line, sung) {
  el.replaceChildren(...(line?.syllables ?? []).map((s, j) => Object.assign(document.createElement('span'), { textContent: s.text, className: j < sung ? 'sung' : '' })));
}

function updateOverlay(t) {
  const time = `${clock(t)} / ${clock(song.length)}`;
  if (ui.time !== time) $('time').textContent = ui.time = time;
  $('progress').firstElementChild.style.width = `${Math.min(100, (t / song.length) * 100)}%`;

  const p = arr.phrases.findLastIndex((x) => x.time <= t);
  if (ui.phrase !== p) {
    ui.phrase = p;
    bars.forEach((b, j) => { b.classList.toggle('done', j < p); b.style.background = ''; });
  }
  if (bars[p]) {
    const pct = Math.min(100, ((t - arr.phrases[p].time) / (arr.phrases[p].endTime - arr.phrases[p].time)) * 100);
    bars[p].style.background = `linear-gradient(90deg, var(--accent) ${pct}%, var(--todo) ${pct}%)`;
  }

  const section = arr.sectionLabels[arr.sections.findLastIndex((x) => x.time <= t)] ?? '';
  if (ui.section !== section) $('section').textContent = ui.section = section;

  const lines = song.lines, li = lines.findLastIndex((l) => l.time <= t + 0.5);
  const current = li >= 0 && t < lines[li].end + 1.5 ? lines[li] : null;
  const upcoming = lines[li + 1] && lines[li + 1].time - t < 8 ? lines[li + 1] : null;
  const sung = current ? current.syllables.filter((s) => s.time <= t).length : 0;
  const lyricKey = `${li}|${!!current}|${sung}|${!!upcoming}`;
  if (ui.lyrics !== lyricKey) {
    ui.lyrics = lyricKey;
    fillLine($('line'), current, sung);
    fillLine($('next'), upcoming, 0);
  }

  if (mic) {
    const hits = arr.notes.filter((n) => n.hit).length, misses = arr.notes.filter((n) => n.missed).length;
    $('accuracy').textContent = hits + misses ? `${Math.round((hits / (hits + misses)) * 100)}%` : '–';
    $('heard').textContent = heard === null ? 'accuracy' : `accuracy · hearing ${noteName(heard)}`;
  }
}

function frame() {
  requestAnimationFrame(frame);
  if (player === synthPlayer && api.tickCache && api.tickCache !== builtCache) {
    builtCache = api.tickCache;
    const next = songFromScore(api.score, api.tickCache);
    synth.tempo = next.tempo;
    setSong(next);
  }
  const t = songTime();
  if (loop && player?.playing && t >= loop.end) player.seek(Math.max(0, loop.start - 1)); // one second of run-up
  score(t);
  drawHighway(canvas, arr, t, theme, cam);
  if (song && arr) updateOverlay(t);
}

usePlayer(synthPlayer);
api.tex(DEMO);
requestAnimationFrame(frame);
</script>
</body>
